name: Build FFmpeg 7.0 for CutCore

on:
  workflow_dispatch: # เพื่อให้กดรันเองได้จากหน้าเว็บ GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config yasm nasm wget tar bzip2

      - name: Run FFmpeg Build Script
        run: |
          chmod +x ./build_ffmpeg.sh
          ./build_ffmpeg.sh

      - name: Upload Native Libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-7.0-android-libs
          path: ffmpeg-7.0/android/
          if-no-files-found: error
