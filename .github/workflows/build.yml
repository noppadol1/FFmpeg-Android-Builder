name: Build FFmpeg Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Prep Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential yasm wget git nasm

      - name: Run Main Build
        run: |
          chmod +x ./build_ffmpeg.sh
          ./build_ffmpeg.sh

      - name: Upload Artifacts
        if: success() # จะอัปโหลดเฉพาะตอนที่คอมไพล์สำเร็จจริงเท่านั้น
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ultimate-v3
          path: build/output/
