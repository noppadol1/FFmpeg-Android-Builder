name: Build FFmpeg Ultimate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential yasm wget git nasm
      - run: |
          chmod +x ./build_ffmpeg.sh
          ./build_ffmpeg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ultimate-v6
          path: build/output/
