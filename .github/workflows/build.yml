name: Build FFmpeg with Android Maker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake libtool pkg-config yasm wget git nasm python3

      - name: Clone FFmpeg Android Maker
        run: git clone https://github.com/Javernaut/ffmpeg-android-maker.git

      - name: Build FFmpeg
        run: |
          cd ffmpeg-android-maker
          # ระบุตำแหน่ง SDK และ NDK ให้สคริปต์หาเจอ
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          
          ./ffmpeg-android-maker.sh \
            -a "arm64-v8a, armeabi-v7a" \
            -i "7.0" \
            --enable-libx264 \
            --enable-libmp3lame
            
      - name: Upload Results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ultimate-maker
          path: ffmpeg-android-maker/output/
