name: Build FFmpeg for CutCore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config yasm nasm wget tar bzip2

      - name: Run Build
        run: |
          chmod +x ./build_ffmpeg.sh
          ./build_ffmpeg.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-libs
          path: ffmpeg-7.0/android/
